# main 푸시 시 데이터 검증 → 테스트 → 빌드 → GitHub Pages 배포.
# 게임 원본은 CI에 없으므로 커밋된 src/data/app/*.json 을 신뢰한다 (ADR-0008 완화책).
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Chromium 설치
        run: npx playwright install --with-deps chromium

      # 로컬 완료 주장과 배포 게이트를 하나로 유지한다. 데이터·전체 단위 테스트·타입·문서·아키텍처·
      # 자산·빌드·접근성·no-JS·반응형·플래너 조작·서비스워커 오프라인을 모두 통과해야 업로드한다.
      - name: Release 검증
        run: npm run verify:release

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
